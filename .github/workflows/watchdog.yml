name: Watchdog

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

# תזמון ותלויות נפרדים לגמרי מ-update.yml - הכלב שמירה לא צריך yfinance ולא
# תלוי בהצלחת main.py, כדי שיוכל להתריע גם כשהצנרת הראשית שבורה לגמרי.
permissions:
  contents: write
  actions: read

concurrency:
  group: dashboard-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check pipeline health
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python watchdog.py

      - name: Commit and push alert marker if changed
        run: |
          git config user.name "dashboard-watchdog"
          git config user.email "actions@github.com"
          if [ -f data/last_watchdog_alert.txt ]; then
            git add data/last_watchdog_alert.txt
            git diff --quiet --cached || git commit -m "Watchdog: record alert timestamp"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push conflict, retrying ($i)..."
              sleep 3
            done
          else
            echo "No alert marker written (pipeline healthy) - nothing to commit."
          fi

      # אם ה-watchdog עצמו נכשל (למשל שגיאת GitHub API), זו בעיה בפני עצמה שאף
      # מנגנון אחר לא יתפוס - שכבת הגנה עצמאית שלא תלויה בשום קובץ אחר בריפו.
      - name: Alert on watchdog failure
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import os, smtplib
          from email.mime.text import MIMEText
          addr = os.environ.get("GMAIL_ADDRESS")
          pwd = os.environ.get("GMAIL_APP_PASSWORD")
          if not addr or not pwd:
              raise SystemExit("no gmail creds available - cannot send failure alert")
          body = "הרצת ה-watchdog עצמו נכשלה - אין כרגע שום בדיקת תקינות פעילה.\n\nבדוק: " + os.environ.get("RUN_URL", "")
          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = "🚨 שי פיננס - ה-watchdog נכשל"
          msg["From"] = addr
          msg["To"] = addr
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(addr, pwd)
              server.send_message(msg)
          print("Failure alert sent.")
          PYEOF
