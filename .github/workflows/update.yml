name: Update dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# מבטיח שרק הרצה אחת של הוורקפלואו רצה בו-זמנית (מחכה בתור במקום לרוץ במקביל) -
# בלי זה, הרצה שנמשכת יותר מ-15 דקות עלולה לחפוף להרצה הבאה ולגרום לשליחת
# סיכום יומי כפול (שתי ההרצות בודקות את קובץ הסימון לפני שאחת מהן הספיקה לעדכן אותו).
concurrency:
  group: dashboard-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dashboard build
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Copy dashboard to index.html for GitHub Pages
        run: cp dashboard.html index.html

      - name: Commit and push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          git add dashboard.html index.html data/
          git diff --quiet --cached || git commit -m "Auto-update dashboard"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push conflict, retrying ($i)..."
            sleep 3
          done
