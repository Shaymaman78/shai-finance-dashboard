name: Update dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dashboard build
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Copy dashboard to index.html for GitHub Pages
        run: cp dashboard.html index.html

      - name: Commit and push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          git add dashboard.html index.html data/
          git diff --quiet --cached || git commit -m "Auto-update dashboard"
          git push
